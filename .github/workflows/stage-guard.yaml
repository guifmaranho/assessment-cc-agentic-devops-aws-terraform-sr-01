name: Stage Guard

# Only the devel branch may be merged into stage.
on:
  pull_request:
    branches:
      - stage

jobs:
  source-branch-check:
    runs-on: ubuntu-latest
    steps:
      - name: Require devel as the source branch
        run: |
          if [ "${{ github.head_ref }}" != "devel" ]; then
            echo "::error::PRs into stage must come from devel (got '${{ github.head_ref }}')."
            exit 1
          fi
          echo "Source branch is devel - OK."
